name: Offline quality checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate manifests and documented media assembly
        run: python -m unittest discover -s tests -v
